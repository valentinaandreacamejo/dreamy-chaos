<footer class="footer">
  <div class="container">
    <div class="top">
      <p class="countdown t-mono" aria-live="off">
        <span class="dot" aria-hidden="true"></span>
        [COUNTDOWN: {{ daysLeft() }} DAYS]
      </p>

      <nav class="socials" aria-label="Social">
        @for (s of socials; track s.label) {
          <a class="neon-badge" [href]="s.href">{{ s.label }}</a>
        }
      </nav>
    </div>

    <p class="wordmark t-mega fx-liquid" aria-hidden="true">DREAMY CHAOS</p>

    <div class="bottom t-mono">
      <span>© {{ year }} DREAMY CHAOS FESTIVAL · EVENTO DI FANTASIA</span>
      <span>ACID Y2K POP ✺ MADE WITH ANGULAR</span>
    </div>

    <p class="credit">
      Designed &amp; Developed by
      <a href="https://portfolio-2026-lyart.vercel.app/" target="_blank" rel="noopener noreferrer">
        Valentina Camejo <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </p>
  </div>
</footer>
