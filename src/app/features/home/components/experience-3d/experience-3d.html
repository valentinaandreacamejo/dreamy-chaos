<section class="section experience" id="experience">
  <div class="container">
    <h2>Enter the <span class="t-glitch">Experience</span></h2>
  </div>

  <div class="stage-3d viewport" aria-hidden="true">
    <div class="scene" [style.transform]="sceneTransform()">
      <div class="carousel">
        @for (face of faces; track face; let i = $index) {
          <div class="face t-display" [style.--i]="i" [style.--n]="faces.length">{{ face }}</div>
        }
      </div>
    </div>
  </div>
</section>
